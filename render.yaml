services:
  - type: web
    name: carecar-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carecar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: START_SCHEDULER
        value: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://carecar.online
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: ^(https?://(localhost|127\.0\.0\.1)(:\d+)?|https://carecar\.online|https://www\.carecar\.online|https://[a-z0-9-]+\.vercel\.app)$

databases:
  - name: carecar-db
    plan: starter
